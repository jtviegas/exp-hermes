name: cicd

env:
  APPROVAL_TEXT: "you should approve this PR to proceed with the release"

on:
  push:
    branches:
      - "workflow_experiment"
  workflow_dispatch:  # Allows manual triggering from the Actions tab, useful for testing and re-runs.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: echo "deployed!"

  peer_approval_brief:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Peer approval brief
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 🚦 Peer approval

          I (System Owner / Delegate / Data Product Owner) 
          approve that the validation report lives up to the requirements.
          EOF
