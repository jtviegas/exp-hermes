  #         EOF

  peer_approval:
    needs: [peer_approval_brief]
    environment: prd
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases
      pull-requests: read  # Required to read PR data for approvals report
      id-token: write
    steps:
      - run: echo "approved"
  
  peer_approval_check:
    needs: [peer_approval]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases
      pull-requests: read  # Required to read PR data for approvals report
      id-token: write
    steps:
      - name: checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: '0'
      - name: Fetch and record approval details
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ./helper.sh check_approval "${{ github.repository }}" "prd" "${{ github.sha }}" "${{ github.run_id }}" approval-record.txt "## 🚦 Peer approval"
        
