name: cicd

env:
  APPROVAL_TEXT: "you should approve this PR to proceed with the release"

on:
  push:
    branches:
      - "workflow_experiment"
  workflow_dispatch:  # Allows manual triggering from the Actions tab, useful for testing and re-runs.

jobs:
  describe:
    runs-on: ubuntu-latest
    steps:
      - name: Publish approval brief
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 🚦 Deployment awaiting approval

          **What you are approving:**
          - **Service:** lib-qsd-jobs
          - **Version/Tag:** ${{ github.ref_name }}
          - **Commit:** ${{ github.sha }}
          - **Triggered by:** ${{ github.actor }}
          - **Environment:** production

          **Changes in this release:**
          - <summary of changes / link to changelog / PR>

          Please review the details above before approving.
          EOF
  
  approval:
    needs: describe
    environment: prd
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases
      pull-requests: read  # Required to read PR data for approvals report
      id-token: write
    steps:
      - run: echo "thank you"

  
  record-approval:
    needs: approval
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and record approval details
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the latest deployment for this ref+environment
          deployment_id=$(gh api \
            "/repos/${{ github.repository }}/deployments?environment=prd&ref=${{ github.sha }}&per_page=1" \
            --jq '.[0].id')

          # Approval reviews contain user, state, comment, and timestamps
          gh api "/repos/${{ github.repository }}/deployments/${deployment_id}/statuses" > /dev/null 2>&1 || true

          gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals" \
            --jq '.[] | select(.state=="approved") |
              "Approver: \(.user.login)\nDate: \(.updated_at)\nComment: \(.comment)"' \
            | tee approval-record.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload approval record
        uses: actions/upload-artifact@v4
        with:
          name: approval-record
          path: approval-record.txt